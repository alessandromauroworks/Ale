<style>

  color-scheme: light;
  --bg:#F2F2F7; --card:#FFFFFF; --field:#FFFFFF; --text:#000000; --muted:#55555B;
  --line:rgba(60,60,67,.28); --sep:rgba(60,60,67,.16);
  --primary:#007AFF; --on-primary:#FFFFFF; --primary-text:#0A5BC4; --primary-soft:rgba(0,122,255,.12);
  --red:#D70015; --red-bg:#FFE9EB; --red-text:#B00012;
  --amber:#8A4B00; --amber-bg:#FFF1D6;
  --ok:#14702B; --ok-bg:#E1F5E7; --bar:#34C759; --track:rgba(120,120,128,.22);
  --key:#E4E4EA;
  --s1-bg:#E5E5EA; --s1-fg:#3A3A3C;
  --s2-bg:#D6E8FF; --s2-fg:#004FB3;
  --s3-bg:#FFE6C2; --s3-fg:#8A4200;
  --s4-bg:#E9DDFB; --s4-fg:#5B2BA0;
  --s5-bg:#D1F0D9; --s5-fg:#0F6B27; --pb:91%; --pf:22%;
  --glass:rgba(255,255,255,.80); --glass-solid:rgba(250,250,252,.98); --glass-border:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95); --glass-shadow:0 10px 32px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.10);
  --scrim:rgba(0,0,0,.38);
  --toast-bg:#1C1C1E; --toast-fg:#FFFFFF; --toast-err-bg:#D70015; --toast-err-fg:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="light"]){
    color-scheme: dark;
    --bg:#000000; --card:#1C1C1E; --field:#2C2C2E; --text:#FFFFFF; --muted:#A8A8B0;
    --line:rgba(235,235,245,.30); --sep:rgba(235,235,245,.16);
    --primary:#0A84FF; --on-primary:#FFFFFF; --primary-text:#6CB2FF; --primary-soft:rgba(10,132,255,.24);

    --amber:#FFC46B; --amber-bg:#3A2A08;

    --key:#2C2C2E;
    --s1-bg:#3A3A3C; --s1-fg:#E5E5EA;
    --s2-bg:#0A2E5C; --s2-fg:#9CC8FF;
    --s3-bg:#4A2E08; --s3-fg:#FFC47A;
    --s4-bg:#3A2766; --s4-fg:#D4BFFF;
    --s5-bg:#123D20; --s5-fg:#8FE3A6; --pb:24%; --pf:86%;
    --glass:rgba(28,28,30,.80); --glass-solid:rgba(28,28,30,.98); --glass-border:rgba(255,255,255,.14);
    --glass-hi:rgba(255,255,255,.08); --glass-shadow:0 10px 32px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);

  }
}
:root[data-tema="dark"]{
  color-scheme: dark;
  --bg:#000000; --card:#1C1C1E; --field:#2C2C2E; --text:#FFFFFF; --muted:#A8A8B0;
  --line:rgba(235,235,245,.30); --sep:rgba(235,235,245,.16);
  --primary:#0A84FF; --on-primary:#FFFFFF; --primary-text:#6CB2FF; --primary-soft:rgba(10,132,255,.24);
  --red:#FF6961; --red-bg:#3A1416; --red-text:#FF9A94;
  --amber:#FFC46B; --amber-bg:#3A2A08;
  --ok:#8FE3A6; --ok-bg:#12301B; --bar:#30D158; --track:rgba(235,235,245,.22);
  --key:#2C2C2E;
  --s1-bg:#3A3A3C; --s1-fg:#E5E5EA;
  --s2-bg:#0A2E5C; --s2-fg:#9CC8FF;
  --s3-bg:#4A2E08; --s3-fg:#FFC47A;
  --s4-bg:#3A2766; --s4-fg:#D4BFFF;
  --s5-bg:#123D20; --s5-fg:#8FE3A6; --pb:24%; --pf:86%;
  --glass:rgba(28,28,30,.80); --glass-solid:rgba(28,28,30,.98); --glass-border:rgba(255,255,255,.14);

  --scrim:rgba(0,0,0,.6);
  --toast-bg:#F2F2F7; --toast-fg:#000000; --toast-err-bg:#FF6961; --toast-err-fg:#1A0000;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.foglio-aperto{overflow:hidden}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;font-weight:700;margin:0 0 10px}
p{margin:0 0 10px}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{flex:0 0 auto}

.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:calc(68px + 12px + 16px + env(safe-area-inset-bottom))}

/* Vetro: solo barre e fogli */
.vetro{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.vetro{background:var(--glass-solid)}}
@media (prefers-reduced-transparency: reduce){.vetro{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* Pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-weight:600;cursor:pointer;text-align:center;transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700;font-size:19px}
.btn.danger{color:var(--red-text);border-color:var(--red)}
.btn.piccolo{min-height:48px;padding:8px 18px;font-size:17px}
.btn.blocco{display:flex;width:100%}
.btn[disabled]{opacity:.6;cursor:default}
.riga-bottoni{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.riga-bottoni .btn{flex:1 1 200px}
.link{min-height:48px;padding:0 6px;border:0;background:transparent;color:var(--primary-text);font-weight:600;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.link:active{opacity:.6}

/* Testata (vetro) */
.top{position:sticky;top:0;z-index:40}
.top::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-bottom:1px solid var(--glass-border)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top::before{background:var(--glass-solid)}}
@media (prefers-reduced-transparency: reduce){.top::before{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px;min-height:56px}
.brand{font-size:19px;font-weight:700;margin:0}
.btn-gear{min-height:48px}
.btn-nuovo{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:35;width:68px;height:68px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;box-shadow:0 8px 22px rgba(0,122,255,.45);font-weight:700;font-size:13px;transition:transform .2s var(--ease)}
.btn-nuovo:active{transform:scale(.94)}
.btn-nuovo .t-lungo{display:none}
.nav{position:fixed;left:12px;right:92px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:35;height:68px;border-radius:34px;padding:6px;display:flex;gap:2px}
.nav button{flex:1;min-height:52px;border:0;border-radius:28px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 2px}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text);font-weight:700}
html{scroll-padding-bottom:112px}
main{padding:10px 0 calc(96px + 16px + env(safe-area-inset-bottom))}

/* Elenchi raggruppati stile Impostazioni di iPhone */
.sez{margin:0 0 22px}
.sez-titolo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--muted);margin:0 0 8px 16px}
.sez.rosso .sez-titolo{color:var(--red-text)}
.sez.giallo .sez-titolo{color:var(--amber)}
.inset{background:var(--card);border-radius:18px;overflow:hidden;margin:0 0 18px}
.inset>*{position:relative}
.inset>*+*::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
.sez.rosso .inset{outline:3px solid var(--red);outline-offset:-3px}
.voce{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.voce:active{background:var(--primary-soft)}
.voce .corpo{flex:1;min-width:0;display:block}
.voce .chev{color:var(--muted)}
.voce .cliente{display:block;font-weight:700;font-size:19px;overflow-wrap:anywhere}
.voce .titolo{display:block;overflow-wrap:anywhere}
.voce .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:6px 0 8px}
.ritardo{color:var(--red-text);font-weight:700}
.ok-card{background:var(--ok-bg);color:var(--ok);border-radius:18px;padding:18px 16px;font-weight:700;font-size:21px;margin:0 0 18px}
.errore-rete{background:var(--red-bg);border:2px solid var(--red);border-radius:18px;padding:16px;margin-bottom:16px}
.errore-rete p{color:var(--red-text);font-weight:700}
.vuoto{background:var(--card);border-radius:18px;padding:26px 16px;text-align:center;font-size:19px;margin:0 0 18px}
.muted{color:var(--muted)}

.badge{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--b);color:var(--f);font-weight:700;font-size:15px;white-space:nowrap}
.fs-disegno{--b:hsl(225 75% var(--pb));--f:hsl(225 85% var(--pf))}
.fs-taglio{--b:hsl(28 75% var(--pb));--f:hsl(28 85% var(--pf))}
.fs-pulizia{--b:hsl(175 75% var(--pb));--f:hsl(175 85% var(--pf))}
.fs-piegatura{--b:hsl(265 75% var(--pb));--f:hsl(265 85% var(--pf))}
.fs-calandratura{--b:hsl(320 75% var(--pb));--f:hsl(320 85% var(--pf))}
.fs-saldatura{--b:hsl(355 75% var(--pb));--f:hsl(355 85% var(--pf))}
.fs-rifinitura{--b:hsl(50 75% var(--pb));--f:hsl(50 85% var(--pf))}
.fs-consegna{--b:hsl(200 75% var(--pb));--f:hsl(200 85% var(--pf))}
.fs-fine{--b:hsl(130 75% var(--pb));--f:hsl(130 85% var(--pf))}

.avanz{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
.barra{display:block;height:10px;background:var(--track);border-radius:6px;overflow:hidden}
.barra>span{display:block;height:100%;background:var(--bar);border-radius:6px}
.avviso-testo{color:var(--amber);font-weight:700}

/* Filtri */
.filtri{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.filtri .btn{min-height:48px;padding:6px 16px;font-size:17px;border-radius:999px;border-color:transparent}
.filtri .btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}
.barra-ricerca{display:grid;gap:10px;margin-bottom:6px}
@media (min-width:820px){.barra-ricerca{grid-template-columns:1fr 260px auto}}
.interruttore{min-height:52px;border:0;border-radius:14px;background:var(--card);padding:8px 18px;font-weight:600;cursor:pointer}
.interruttore[aria-checked="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}
.cerca-input{width:100%;min-height:52px;padding:10px 16px;border:0;border-radius:14px;background:var(--card)}

/* Moduli */
.campo{margin:0 0 16px}
.campo label{display:block;font-weight:600;margin-bottom:6px}
.campo input,.campo textarea{width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text)}
.campo textarea{min-height:110px;resize:vertical}
.campo .aiuto{font-size:15px;color:var(--muted);margin:4px 0 0}
.campo .err{color:var(--red-text);font-weight:700;margin:6px 0 0}
.campo.ha-errore input,.campo.ha-errore textarea{border-color:var(--red);border-width:2px}
.due-colonne{display:grid;gap:0 14px}
@media (min-width:600px){.due-colonne{grid-template-columns:1fr 1fr}}
.form{max-width:640px}

/* Scheda lavoro */
.indietro{margin:2px 0 0 -6px}
.stati{margin:0 0 18px}
.stato{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;background:transparent;color:var(--text);font-weight:500;text-align:left;cursor:pointer;font-size:18px}
.stato .pallino{width:14px;height:14px;border-radius:50%;background:var(--f);flex:0 0 auto}
.stato .etichetta{flex:1}
.stato[aria-pressed="true"]{background:var(--b);color:var(--f);font-weight:700}
.cartella{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.cartella code{flex:1 1 220px;overflow-wrap:anywhere;font-size:16px;user-select:all}
.note-box{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.riga{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.riga .testo{flex:1;min-width:0;overflow-wrap:anywhere}
.riga .principale{font-weight:600}
.riga .piccolo{font-size:16px;color:var(--muted)}
.riga .azioni{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fatto-tag{color:var(--ok);font-weight:700;font-size:16px}
.spunta{flex:0 0 auto;width:48px;height:48px;min-height:48px;border:2.5px solid var(--muted);border-radius:50%;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .2s var(--ease)}
.spunta:active{transform:scale(.92)}
.spunta[aria-checked="true"]{background:var(--bar);border-color:var(--bar)}
.gruppo{margin:0 0 6px}
.gruppo-titolo{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:20px;margin:0 0 8px 4px}
.pill-tot{font-size:15px;font-weight:700;color:var(--primary-text);background:var(--primary-soft);padding:2px 12px;border-radius:999px}
.impostazioni .voce{min-height:64px;font-weight:600}
.esci-zona{margin-top:40px;padding-top:18px}

/* Avvisi a comparsa */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;padding:8px 18px;font-size:16px;border-radius:999px;background:var(--toast-bg);color:var(--toast-fg);font-weight:700;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none}
.toast.err{background:var(--toast-err-bg);color:var(--toast-err-fg);border-radius:16px}
.undo{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));margin:0 auto;max-width:560px;z-index:70;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--toast-bg);color:var(--toast-fg);padding:8px 8px 8px 18px;border-radius:18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.undo .btn{min-height:48px;background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}

/* Fogli e avvisi: salgono dal basso su telefono */
.overlay{position:fixed;inset:0;z-index:90;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:dissolvi .25s var(--ease)}
.dialog,.foglio{width:100%;max-width:600px;max-height:92vh;overflow:auto;color:var(--text);animation:sale .38s var(--ease)}
.dialog{margin:0 8px calc(8px + env(safe-area-inset-bottom));border-radius:28px;padding:22px}
.foglio{border-radius:28px 28px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));border-bottom:0}
.foglio-testa{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;margin:0 -8px 8px}
.foglio-testa h2{margin:0;text-align:center;font-size:20px}
.dialog h2{font-size:24px}
.dialog.attenzione h2,.dialog.attenzione .dlg-icona{text-align:center}
.dlg-icona{display:flex;justify-content:center;color:var(--amber);margin-bottom:8px}
.dialog ul{margin:0 0 12px;padding:12px 16px 12px 36px;overflow-wrap:anywhere;background:var(--amber-bg);border-radius:14px}
.dialog .btn{width:100%;margin-top:10px}
@keyframes sale{from{transform:translateY(100%)}to{transform:none}}
@keyframes dissolvi{from{opacity:0}to{opacity:1}}
@keyframes appare{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* Fasi, interruttori, lavoretti, clienti */
.btn.grande{min-height:64px;font-size:22px;margin:0 0 14px}
.meta-scheda{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
.tag-lav{display:inline-block;padding:1px 10px;border-radius:8px;border:2px solid var(--muted);color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap}
.fase-riga{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;background:transparent;color:var(--text);font-size:18px;text-align:left}
button.fase-riga{cursor:pointer}
.fase-riga .fp{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.fase-riga.fatta .fp{background:var(--bar);border-color:var(--bar)}
.fase-riga.attuale{background:var(--primary-soft);font-weight:700}
.fase-riga.attuale .fp{border-color:var(--primary);border-width:4px}
.fase-riga .et{flex:1}
.fase-riga .st{font-size:15px;color:var(--muted);font-weight:600}

    if (attesa || codice.length >= 6) return;

    aggiorna();
    if (codice.length === 6) invia();
  }
  function cancella() {

    codice = codice.slice(0, -1);
    aggiorna();
  }

  var griglia = h('div', { class: 'cod-griglia' }, [

        if (S.screen === 'login' || S.screen === 'fatal') return;
        azzeraDati();
        chiudiFinestre(); nascondiUndo();
        S.screen = 'login'; render();
      }, 0);
    }
  });
  var sessione = null, senzaRete = false;
  try {
    var r = await sb.auth.getSession();
    sessione = r && r.data ? r.data.session : null;
    if (!sessione && r && r.error) {
      var m = String(r.error.name || '') + ' ' + String(r.error.message || '');
      if (/retryable|fetch|network|failed|timeout|abort/i.test(m) || !navigator.onLine) senzaRete = true;
    }
  } catch (e) { senzaRete = !navigator.onLine || /fetch|network|failed|timeout|abort/i.test(String(e && e.message)); }
  if (sessione) { entraApp(); return; }
  if (senzaRete) { S.screen = 'fatal'; render(); return; }
  S.screen = 'login'; render();
}
avvio();
})();
</script>
