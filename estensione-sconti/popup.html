<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cacciasconti</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="logo">%</div>
  <div><h1>Cacciasconti</h1><div id="sito" class="piccolo"></div></div>
</header>

<nav>
  <button class="scheda attiva" data-s="codici">Codici</button>
  <button class="scheda" data-s="risparmi">Risparmi</button>
  <button class="scheda" data-s="opzioni">Opzioni</button>
</nav>

<section id="s-codici">
  <div id="conteggio" class="piccolo"></div>
  <button id="genera" class="grande" disabled>Genera sconto</button>
  <div id="spiega" class="piccolo avviso"></div>
  <div id="risultato" class="risultato" hidden></div>
  <button id="riprova" class="link" hidden>Riprova anche i codici che non funzionavano</button>
  <ul id="lista"></ul>
  <form id="aggiungi">
    <input id="nuovo" type="text" placeholder="Aggiungi un codice a mano" maxlength="20" autocomplete="off">
    <button type="submit">Aggiungi</button>
  </form>
  <div id="errore" class="piccolo errore"></div>
</section>

<section id="s-risparmi" hidden>
  <div class="totale"><span class="piccolo">Totale risparmiato</span><div id="totale">0,00 €</div></div>
  <ul id="storico"></ul>
</section>

<section id="s-opzioni" hidden>
  <label class="riga"><input type="checkbox" id="comuni"> Usa anche i codici comuni</label>
  <label class="blocco">Quanti codici provare al massimo: <b id="maxv">20</b>
    <input type="range" id="max" min="3" max="40" step="1"></label>
  <div class="riga2">
    <button id="esporta" class="sec">Salva i codici in un file</button>
    <button id="importa" class="sec">Carica da file</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <p class="piccolo">Tutto resta sul tuo computer. Nessun invio, nessun link di affiliazione, nessun cookie toccato.</p>
</section>
<script src="domain.js"></script>
<script src="popup.js"></script>
</body>
</html>
