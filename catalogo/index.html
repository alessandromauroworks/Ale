<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Automazioni · Alessandro Mauro</title>
<style>
:root{--bg:#fff;--g1:#f5f5f7;--g2:#d2d2d7;--g3:#6e6e73;--ink:#1d1d1f;--blu:#0071e3;--blu2:#e8f1fc;--grigio:#aeaeb2;--verde:#34c759;
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--ink);background:var(--bg);line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1{font-size:clamp(40px,8vw,72px);line-height:1.02;letter-spacing:-.035em;font-weight:700}
h2{font-size:clamp(28px,5vw,44px);line-height:1.08;letter-spacing:-.025em;font-weight:700}
.kick{font-size:15px;font-weight:600;color:color-mix(in srgb,var(--acc,var(--blu)) 72%,#000);margin-bottom:10px}
:focus-visible{outline:3px solid var(--a2,var(--blu));outline-offset:3px;border-radius:10px}
.sub{color:var(--g3);font-size:clamp(19px,2.6vw,24px);margin-top:14px;max-width:640px}
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(0,0,0,.06)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:600;font-size:15px}
.back{border:0;background:var(--g1);color:var(--ink);font:500 14px var(--f);padding:8px 14px;border-radius:999px;cursor:pointer}
/* icone */
.ico{display:block}
.tileic{display:inline-grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,var(--a1),var(--a2));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25),0 6px 16px -6px var(--a2)}
/* home catalogo */
.home{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:center;min-height:calc(100vh - 52px);padding:30px 0}
.home h1{font-size:clamp(44px,7vw,80px);letter-spacing:-.045em;line-height:.98}
.home .sub{max-width:520px}
.home .meta{margin-top:30px;display:flex;gap:28px;flex-wrap:wrap}
.home .meta div b{display:block;font-size:30px;letter-spacing:-.03em}.home .meta div span{font-size:14px;color:var(--g3)}
.hs{position:relative;width:310px;height:620px;margin:0 auto;border-radius:52px;padding:12px;background:linear-gradient(145deg,#4a4a4e,#1c1c1e 18%,#0d0d0f 60%,#3a3a3d);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 40px 80px -20px rgba(0,0,0,.35);transform:rotateY(-12deg) rotateX(4deg);transition:transform 1.2s var(--ease)}
.hstage{perspective:1600px}.hstage:hover .hs{transform:rotateY(-4deg) rotateX(2deg)}
.hs .scr{background:radial-gradient(120% 70% at 20% 0%,#ffd6a5 0%,transparent 55%),radial-gradient(90% 60% at 100% 30%,#b5d5ff 0%,transparent 60%),radial-gradient(100% 70% at 30% 100%,#ffc2d9 0%,transparent 60%),#f2eefb}
.hs .clock{text-align:center;margin-top:46px;font-size:15px;font-weight:600;color:#1d1d1f;opacity:.85}
.hs .wid{margin:14px 16px 0;border-radius:22px;padding:14px 16px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.hs .wid small{font-size:11px;font-weight:600;color:var(--g3)}.hs .wid b{display:block;font-size:17px;letter-spacing:-.02em;margin-top:2px}
.hs .wid .bar2{height:6px;border-radius:3px;background:rgba(0,0,0,.08);margin-top:10px;overflow:hidden}.hs .wid .bar2 i{display:block;height:100%;width:0;border-radius:3px;background:#34c759;animation:fillw 2.4s var(--ease) .8s forwards}
@keyframes fillw{to{width:72%}}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;padding:22px 18px 0}
.ap{border:0;background:none;font:inherit;color:#1d1d1f;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:scale(.6);animation:popi .6s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d)}
.ap span:last-child{font-size:11px;font-weight:500;max-width:84px;text-align:center;line-height:1.15}
.ap:hover .tileic,.ap:focus-visible .tileic{transform:scale(1.08)}.ap .tileic{transition:transform .3s var(--ease)}
@keyframes popi{to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a2) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.dock{position:absolute;left:22px;right:22px;bottom:24px;height:74px;border-radius:26px;background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around}
.hint{position:absolute;left:0;right:0;bottom:110px;text-align:center;font-size:12px;font-weight:600;color:#1d1d1f;opacity:.7}

/* intro catalogo */
.intro2{min-height:calc(100vh - 52px);display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:center;padding:28px 0 40px}
.who2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:color-mix(in srgb,var(--cur) 72%,#000);transition:color .6s}
.who2 .tileic{transition:background .6s}
.hl{font-size:clamp(46px,7.4vw,92px);line-height:1;letter-spacing:-.045em;font-weight:700;margin-top:18px;min-height:2.05em}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.hl .w i{font-style:normal;display:inline-block;transform:translateY(105%);transition:transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d)}
.hl.in .w i{transform:none}.hl.out .w i{transform:translateY(-105%);transition-duration:.45s;transition-delay:calc(var(--d) * .4)}
.fix{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:clamp(19px,2.4vw,24px);font-weight:600;color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.fix.in{opacity:1;transform:none}
.fix b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:color-mix(in srgb,var(--cur) 85%,#000);transition:background .6s}
.pickh{margin-top:34px;font-size:15px;font-weight:600;color:var(--g3);display:flex;align-items:center;gap:8px}
.pickh{color:var(--ink)}.pickh .ico{color:var(--cur)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;max-width:620px}
.pk{position:relative;overflow:hidden;border:1.5px solid #e5e5ea;background:#fff;border-radius:18px;padding:12px;font:600 14px var(--f);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;line-height:1.2;transition:border-color .3s,transform .25s var(--ease),box-shadow .3s}
.pk:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px var(--c);border-color:var(--c)}
.pk:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.pk i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c);z-index:0}
.pk span{position:relative;z-index:1}
.pk .go2{margin-left:auto;color:var(--c);opacity:0;transform:translateX(-4px);transition:all .25s}
.pk:hover .go2,.pk.on .go2{opacity:1;transform:none}
.pk.on{color:color-mix(in srgb,var(--c) 70%,#000);border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,#fff)}
.pk.on i{animation:prog var(--t) linear forwards}.paused .pk.on i{animation-play-state:paused}
@keyframes prog{to{width:100%}}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.cta1{border:0;border-radius:999px;padding:15px 24px;font:700 17px var(--f);color:#fff;background:color-mix(in srgb,var(--cur) 78%,#000);cursor:pointer;transition:background .6s,transform .2s}
.cta1:active{transform:scale(.97)}
.cta2{border:0;background:none;font:600 17px var(--f);color:var(--ink);cursor:pointer;padding:15px 6px}
.ph2{position:relative;width:300px;height:610px;margin:0 auto;border-radius:52px;padding:12px;background:linear-gradient(145deg,#4a4a4e,#1c1c1e 18%,#0d0d0f 60%,#3a3a3d);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 40px 80px -20px rgba(0,0,0,.35);transform:rotateY(var(--ry,-10deg)) rotateX(var(--rx,4deg));transition:transform 1s var(--ease)}
.ph2 .scr{transition:background 1s}
.ph2 .icons{padding-top:148px}
.ap.hot .tileic{animation:ring 1.6s ease-out infinite;transform:scale(1.14);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 14px 30px -8px var(--a2)}
.ap.dim{opacity:.45!important}.ap{transition:opacity .5s}
.ntf{position:absolute;left:12px;right:12px;top:52px;z-index:4;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:18px;padding:11px 13px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.16);transform:translateY(-150%);transition:transform .6s cubic-bezier(.2,1.3,.4,1)}
.ntf.in{transform:none}
.ntf .ic2{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:#ff3b30;transition:background .4s}
.ntf.ok .ic2{background:#34c759}
.ntf small{display:block;font-size:11px;color:var(--g3);font-weight:600}.ntf div div{font-size:13px;font-weight:500}
@media (max-width:900px){.pick{grid-template-columns:repeat(2,minmax(0,1fr))}.intro2{grid-template-columns:minmax(0,1fr);min-height:0;padding-top:34px;gap:28px}.hl{min-height:3.1em}.ph2{width:270px;height:540px;--ry:0deg;--rx:0deg}}
/* altre attività */
.altre{padding:30px 0 10px}.altre h2{font-size:clamp(24px,3.4vw,32px);margin-bottom:16px}
.altreg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.alt{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px solid #e5e5ea;border-radius:18px;color:inherit;text-decoration:none;transition:border-color .3s,transform .25s var(--ease)}
.alt:hover{border-color:var(--c);transform:translateY(-2px)}
.alt b{display:block;font-size:14px}.alt small{display:block;font-size:13px;color:var(--g3);margin-top:2px}
@media (max-width:900px){.altreg{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* elenco */
.lst{padding:20px 0 70px}
.lst h2{margin-bottom:6px}
.lst > p{color:var(--g3);font-size:18px;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--g2);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px var(--f);color:var(--ink);cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowa{display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;padding:22px 0;border-top:1px solid #e8e8ed;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.rowa:last-child{border-bottom:1px solid #e8e8ed}
.rowa h3{font-size:24px;letter-spacing:-.025em}.rowa .se{font-size:14px;color:var(--g3);margin-top:2px}
.rowa p{font-size:16px;margin-top:8px;max-width:560px}
.mini{display:flex;gap:6px;margin-top:12px}.mini i{width:28px;height:28px;border-radius:8px;background:var(--g1);color:var(--ac);display:grid;place-items:center;transition:background .3s,color .3s}
.rowa:hover .mini i{background:var(--ac);color:#fff}.rowa:hover .mini i:nth-child(2){transition-delay:.04s}.rowa:hover .mini i:nth-child(3){transition-delay:.08s}.rowa:hover .mini i:nth-child(4){transition-delay:.12s}.rowa:hover .mini i:nth-child(5){transition-delay:.16s}.rowa:hover .mini i:nth-child(6){transition-delay:.2s}
.open{border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;color:#fff;background:color-mix(in srgb,var(--ac) 78%,#000);white-space:nowrap}
.zoom{position:fixed;z-index:60;background:linear-gradient(180deg,var(--a1),var(--a2));transition:all .55s cubic-bezier(.6,0,.2,1)}
@media (max-width:900px){.home{grid-template-columns:1fr;gap:20px;min-height:0;padding-top:40px}.hs{transform:none}.rowa{grid-template-columns:52px 1fr}.rowa .open{display:none}}
/* catalogo */
.cat{padding:56px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 22px}
.chip{border:1px solid var(--g2);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px var(--f);color:var(--ink);cursor:pointer;transition:all .25s var(--ease)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--g1);border-radius:22px;padding:26px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;transition:transform .45s var(--ease),box-shadow .45s var(--ease),background .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.08);background:#fff}
.card .ic{font-size:34px;margin-bottom:14px}.card .se{font-size:13px;color:var(--g3);font-weight:500}
.card h3{font-size:26px;letter-spacing:-.02em;margin:4px 0 8px}.card p{color:var(--g3);font-size:15px}
.card .go{margin-top:18px;font-size:14px;font-weight:600;color:var(--blu)}
/* hero */
.hero .tileic{margin-bottom:22px}
.hero{min-height:calc(92vh - 52px);display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.prob{margin-top:28px;display:inline-flex;gap:10px;align-items:center;background:var(--g1);border-radius:16px;padding:14px 18px;font-size:17px;max-width:620px;align-self:flex-start}
.prob b{color:#d70015;font-weight:600;white-space:nowrap}
.how{margin-top:26px;display:grid;grid-template-columns:repeat(3,auto);gap:10px 26px;justify-content:start;font-size:15px;color:var(--g3)}
.how span{display:flex;align-items:center;gap:8px}.how i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-size:14px;color:var(--g3)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.c-cliente{background:#636366}.c-auto{background:var(--blu)}.c-titolare{background:var(--ink)}
.scroll{margin-top:36px;font-size:15px;color:var(--g3);display:flex;align-items:center;gap:10px}
.scroll i{width:22px;height:34px;border:2px solid var(--g2);border-radius:12px;position:relative}
.scroll i:after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:var(--g3);animation:sc 1.6s infinite}
@keyframes sc{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.pill{display:inline-block;margin-top:16px;background:var(--g1);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--g3);align-self:flex-start}
/* costruzione */
.build{display:grid;grid-template-columns:1fr 400px;gap:60px;position:relative}
.step{min-height:82vh;display:flex;flex-direction:column;justify-content:center;opacity:.25;transition:opacity .5s var(--ease);padding:20px 0}
.step.on{opacity:1}
.step .num{font-size:14px;font-weight:600;color:var(--g3);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step .num span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.step .ic{margin-bottom:14px;width:56px;height:56px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,var(--a1),var(--a2))}
.step.intro .ic{background:#fde8ea;color:#d70015}
.step h3{font-size:clamp(30px,4.5vw,46px);line-height:1.06;letter-spacing:-.03em;font-weight:700}
.step p{font-size:clamp(19px,2.4vw,23px);color:var(--g3);margin-top:12px;max-width:480px}
.gain{margin-top:22px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:color-mix(in srgb,var(--a2) 12%,#fff);color:color-mix(in srgb,var(--a2) 65%,#000);border-radius:999px;padding:9px 16px;font-size:16px;font-weight:600}
.step.intro .gain{background:#fde8ea;color:#d70015}
.who{font-style:normal;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.who.cliente{background:#ececf0;color:var(--ink)}.who.auto{background:var(--blu2);color:#0058b0}.who.titolare{background:var(--ink);color:#fff}.who.oggi{background:#fde8ea;color:#d70015}
.inl{display:none}
.steps{padding-bottom:22vh}
.panel{position:sticky;top:64px;align-self:start;height:calc(100vh - 76px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.prog{width:100%;max-width:360px;background:#fff;border:1px solid #e5e5ea;border-radius:22px;padding:14px 14px 12px;box-shadow:0 14px 34px -22px rgba(0,0,0,.35)}
.pst{display:flex;align-items:center;gap:10px}
.lamp{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#c7c7cc;transition:background .5s}
.lamp.off{background:#ff3b30;animation:pulse 1.6s infinite}.lamp.on{background:linear-gradient(180deg,var(--a1),var(--a2))}.lamp.done{background:#34c759}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}100%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}
.pst b{display:block;font-size:15px;letter-spacing:-.01em}.pst small{display:block;font-size:13px;color:var(--g3);margin-top:1px}
.pst .cnt2{margin-left:auto;font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.pst .cnt2 span{font-size:13px;color:var(--g3);font-weight:600}
.chain{display:flex;justify-content:space-between;position:relative;margin-top:14px}
.rail{display:none}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.seg i{height:5px;border-radius:3px;background:#e5e5ea;transition:background .4s var(--ease)}
.seg i.f{background:var(--a2)}
.node{cursor:pointer;font:inherit;position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--g2);display:grid;place-items:center;color:var(--g3);opacity:.5;transition:all .45s var(--ease)}
.node.vis{opacity:1;border-color:transparent;color:var(--ink)}
.node.vis.cliente{background:#e5e5ea}.node.vis.auto{background:var(--blu2)}.node.vis.titolare{background:#e8e8ed}
.node.act{transform:scale(1.15);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--a2);background:var(--a2)!important;color:#fff}
.node.vis:not(.act):after{content:"✓";position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--verde);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
.plabel{display:none}
/* telefono */
.stage{perspective:1600px}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.phone{position:relative;width:300px;height:min(580px,calc(100vh - 230px));min-height:430px;border-radius:48px;padding:11px;
background:linear-gradient(145deg,#4a4a4e 0%,#1c1c1e 18%,#0d0d0f 60%,#3a3a3d 100%);
box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),calc(var(--sx,0px)) 34px 70px rgba(0,0,0,.22),0 8px 20px rgba(0,0,0,.12);
transform-style:preserve-3d;transform:rotateY(calc(var(--ry,0deg) + var(--mx,0deg))) rotateX(calc(var(--rx,0deg) + var(--my,0deg)));transition:transform .9s var(--ease),box-shadow .9s var(--ease)}
.phone .sb{position:absolute;width:3px;border-radius:2px;background:#2c2c2e}
.phone .sb.a{left:-3px;top:110px;height:30px}.phone .sb.b{left:-3px;top:154px;height:52px}.phone .sb.c{right:-3px;top:140px;height:74px}

  else{lamp.className="lamp on";lamp.innerHTML=icn(corrente.passi[i-1][0],17);tt.textContent="Passo "+i+": "+corrente.passi[i-1][1];ss.textContent="Accesi "+i+" pezzi su "+n}

  var ph=app.querySelector(".panel .phone");if(ph&&i!==null){var ry=(i%2?-9:9);ph.style.setProperty("--ry",ry+"deg");ph.style.setProperty("--sx",(-ry*2)+"px");ph.querySelector(".scr").style.setProperty("--gx",(i%2?"20%":"80%"));ph.classList.remove("swing");void ph.offsetWidth;ph.classList.add("swing")}
  if(i!==null){var inl=passiEl[i].querySelector(".inl .sc");if(inl&&window.innerWidth<=900)play(inl)}
}
function aggiorna(){
  if(!corrente)return;
  var mid=window.innerHeight*0.5,best=null,bd=1e9;
  passiEl.forEach(function(s,k){var r=s.getBoundingClientRect(),c=r.top+r.height/2,d=Math.abs(c-mid);if(r.top<window.innerHeight*0.85&&r.bottom>0&&d<bd){bd=d;best=k}});
  if(window.innerWidth>900&&best===null&&passiEl[0].getBoundingClientRect().top<window.innerHeight)best=0;
  setAttivo(best);
  if(window.innerWidth<=900){var vh=window.innerHeight;app.querySelectorAll(".inl .phone").forEach(function(p){var r=p.getBoundingClientRect();var x=Math.max(-10,Math.min(22,(r.top-vh*0.35)/vh*40));p.style.setProperty("--rx",x.toFixed(1)+"deg");p.style.setProperty("--ry",(-x*0.35).toFixed(1)+"deg")})}
  ["res","links"].forEach(function(id){var el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<window.innerHeight*0.8)el.classList.add("in")});
}
document.addEventListener("mousemove",function(e){var p=app.querySelector(".panel .phone");if(!p||window.innerWidth<=900)return;var r=p.getBoundingClientRect();var dx=(e.clientX-(r.left+r.width/2))/window.innerWidth,dy=(e.clientY-(r.top+r.height/2))/window.innerHeight;p.style.setProperty("--mx",(dx*14).toFixed(2)+"deg");p.style.setProperty("--my",(-dy*10).toFixed(2)+"deg")});
var tk=false;window.addEventListener("scroll",function(){if(!tk){tk=true;requestAnimationFrame(function(){tk=false;aggiorna()})}},{passive:true});
window.addEventListener("resize",function(){attivo=undefined;aggiorna()});

function vai(){var id=SOLO||location.hash.replace("#","");var a=AUTOMAZIONI.filter(function(x){return x.id===id})[0];if(a)scheda(a);else catalogo()}
back.onclick=function(){location.hash=""};
window.addEventListener("hashchange",vai);
document.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("copy",function(e){e.preventDefault()});
document.addEventListener("dragstart",function(e){e.preventDefault()});
try{if(SCADENZA){var p=SCADENZA.split("-"),fine=new Date(+p[0],+p[1]-1,+p[2],23,59,59);if(Date.now()>fine.getTime()){document.getElementById("exp").classList.add("on");document.querySelector(".wrap0").style.display="none";}}}catch(e){}
vai();
})();
</script>
