name: Analizza - prova di fattibilita'

on:
  push:
    branches: [claude/analizza-cloud]
    paths: [analizza-cloud/prova.py, .github/workflows/analizza-prova.yml]

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ffmpeg, yt-dlp, faster-whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U yt-dlp faster-whisper
      - name: Prova i 3 video (stampa solo esito, tempi e pesi)
        run: python analizza-cloud/prova.py
