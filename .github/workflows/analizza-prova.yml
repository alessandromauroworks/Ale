name: Analizza - prova di fattibilita'

on:
  push:
    branches: [claude/analizza-cloud]
    paths: [analizza-cloud/**, .github/workflows/analizza-prova.yml]

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ffmpeg, yt-dlp, faster-whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default]" faster-whisper
          yt-dlp --version; python --version; nproc
      - name: Collaudo del lavoratore vero (senza Supabase, stampa solo esito e tempi)
        run: python analizza-cloud/lavora.py --prova
