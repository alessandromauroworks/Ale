name: Analizza nel cloud

# Lo avvia la Edge Function Supabase «analizza-cloud» quando c'e' un link in coda e il PC e' spento.
# Si puo' avviare anche a mano: Actions > Analizza nel cloud > Run workflow.
# I log sono PUBBLICI: lo script stampa solo numero della riga, esito e tempi.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analizza-cloud
  cancel-in-progress: false

jobs:
  lavora:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: analizza-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analizza-cloud/requirements.txt
      - name: Modello di trascrizione in cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Installa ffmpeg, yt-dlp, faster-whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U -r analizza-cloud/requirements.txt
      - name: Lavora la coda
        env:
          ANALIZZA_CLOUD_CODICE: ${{ secrets.ANALIZZA_CLOUD_CODICE }}
        run: python analizza-cloud/lavora.py
